<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siri Liquid Glass Waveform</title>
    <style>
        :root {
            --bg-color: #f0f2f5; /* Light background like the image */
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: rgba(255, 255, 255, 0.5);
            --sphere-shadow: rgba(174, 174, 192, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #333;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #e6e9f0 100%);
            overflow: hidden;
        }

        /* Background Light Flow Effect */
        .light-flow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg at 50% 50%,
                rgba(255, 255, 255, 0) 0deg,
                rgba(224, 195, 252, 0.1) 60deg,  /* Purple tint */
                rgba(255, 255, 255, 0) 120deg,
                rgba(142, 197, 252, 0.1) 180deg, /* Blue tint */
                rgba(255, 255, 255, 0) 240deg,
                rgba(144, 247, 236, 0.1) 300deg, /* Cyan tint */
                rgba(255, 255, 255, 0) 360deg
            );
            animation: rotateLight 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        .light-flow-2 {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 60%);
            mix-blend-mode: overlay;
            animation: pulseLight 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulseLight {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Liquid Glass Sphere */
        .glass-panel {
            position: relative;
            width: 320px;
            height: 320px;
            
            /* Back Glass Body (Behind content) - Minimal tint */
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
                
            backdrop-filter: blur(3px); /* Low blur for high transparency */
            -webkit-backdrop-filter: blur(3px);
            
            border-radius: 50%;
            
            /* Sharp Glass Border */
            border: 1px solid rgba(255, 255, 255, 0.4);
            
            /* Realistic Shadow & Volume */
            box-shadow: 
                /* Deep Shadow */
                0 40px 80px -10px rgba(0,0,0,0.2),
                /* Caustic Light Leak in Shadow (Fake it with multiple shadows) */
                0 50px 40px -20px rgba(255,255,255,0.3),
                /* Inner Refraction/Volume */
                inset 0 0 20px rgba(255,255,255,0.3),
                inset 10px 10px 30px rgba(255,255,255,0.4),
                inset -5px -5px 20px rgba(255,255,255,0.2),
                0 0 0 1px rgba(255,255,255,0.2);
                
            display: flex;
            justify-content: center;
            align-items: center;
            /* overflow: hidden; Removed to allow external glow/caustics if needed, but children are clipped */
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        /* Active state animation */
        .glass-panel.active {
            box-shadow: 
                0 50px 90px -10px rgba(0,0,0,0.25),
                0 60px 50px -20px rgba(255,255,255,0.4), /* Brighter caustic */
                inset 0 0 30px rgba(255,255,255,0.5),
                inset 10px 10px 40px rgba(255,255,255,0.5),
                inset -5px -5px 25px rgba(255,255,255,0.3),
                0 0 0 2px rgba(255,255,255,0.3);
            transform: scale(1.02);
        }
        
        /* Caustic / Projection Effect */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 50%);
            transform: translate(-20%, -20%) rotate(45deg); /* Project light towards bottom right */
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: overlay;
            filter: blur(15px);
        }
        
        /* Front Glass Reflections (The Sun & Gloss) */
        .glass-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            z-index: 50; /* Ensure on top of content */
            pointer-events: none;
            
            background: 
                /* Sharp Sun Spot */
                radial-gradient(ellipse at 28% 28%, rgba(255,255,255,1) 0%, rgba(255,255,255,0.8) 4%, rgba(255,255,255,0) 15%),
                /* Specular Glow */
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%),
                /* Bottom Internal Reflection */
                radial-gradient(circle at 70% 70%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 60%),
                /* Surface Sheen */
                linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%);
                
            mix-blend-mode: normal;
        }

        /* Siri Blob Animation - Contained inside sphere now? 
           The image shows the wave inside. The blobs might interfere if they are background.
           Let's make them subtle inside the sphere. */
        .siri-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: blur(40px);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: multiply; /* Better for light background */
            filter: blur(30px);
            animation: rotate 10s infinite linear;
        }

        .blob:nth-child(1) {
            width: 150px;
            height: 150px;
            background: #a18cd1; /* Purple */
            top: 20%;
            left: 20%;
            animation-duration: 8s;
        }

        .blob:nth-child(2) {
            width: 180px;
            height: 180px;
            background: #fbc2eb; /* Pink */
            bottom: 20%;
            right: 20%;
            animation-duration: 12s;
            animation-direction: reverse;
        }

        .blob:nth-child(3) {
            width: 140px;
            height: 140px;
            background: #84fab0; /* Cyan/Green */
            bottom: 10%;
            left: 30%;
            animation-duration: 6s;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            33% { transform: rotate(120deg) translate(20px, -20px) scale(1.1); }
            66% { transform: rotate(240deg) translate(-20px, 20px) scale(0.9); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }

        /* Canvas for Waveform */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            border-radius: 50%;
        }

        .controls {
            margin-top: 50px;
            z-index: 30;
            text-align: center;
        }

        button {
            padding: 12px 30px;
            background: white;
            border: none;
            color: #666;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            color: #333;
        }

        button:active {
            transform: translateY(0);
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Background Lights -->
        <div class="light-flow"></div>
        <div class="light-flow-2"></div>
        
        <div class="glass-panel" id="visualizer-container">
            <!-- Siri Background Animation -->
            <div class="siri-container">
                <div class="blob"></div>
                <div class="blob"></div>
                <div class="blob"></div>
            </div>
            
            <!-- Waveform Canvas -->
            <canvas id="waveform"></canvas>
        </div>

        <div class="controls">
            <button id="start-btn">Start Listening</button>
            <div class="status" id="status-text">Click to enable microphone</div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');
        const siriContainer = document.querySelector('.siri-container');
        const glassPanel = document.getElementById('visualizer-container');
        const statusText = document.getElementById('status-text');
        
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let isListening = false;
        let animationId;
        
        // Animation State
        let visualScale = 0; // 0 to 1, controls entry/exit animation
        let targetVisualScale = 0;

        // Resize canvas
        function resizeCanvas() {
            // Make canvas high resolution
            const scale = window.devicePixelRatio || 1;
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            
            canvas.width = width * scale;
            canvas.height = height * scale;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(scale, scale);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        startBtn.addEventListener('click', async () => {
            if (isListening) {
                stopListening();
            } else {
                await startListening();
            }
        });

        async function startListening() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                // Configure analyser
                analyser.fftSize = 512; 
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                source.connect(analyser);
                
                isListening = true;
                targetVisualScale = 1; // Start entry animation
                
                startBtn.textContent = "Stop Listening";
                statusText.textContent = "Listening...";
                glassPanel.classList.add('active');
                
                // Ensure loop is running
                if (!animationId) {
                    draw();
                }
            } catch (err) {
                console.error('Error accessing microphone:', err);
                statusText.textContent = "Error accessing microphone. Please allow permissions.";
            }
        }

        function stopListening() {
            // Don't close context immediately, wait for animation
            isListening = false;
            targetVisualScale = 0; // Start exit animation
            
            startBtn.textContent = "Start Listening";
            statusText.textContent = "Click to enable microphone";
            glassPanel.classList.remove('active');
            
            // Note: audioContext will be closed when visualScale hits 0
        }

        // Wave animation parameters
        let phase = 0;
        let currentVolume = 0; // For smoothing
        const NOISE_THRESHOLD = 0.1; // Ignore sounds below this level
        const SMOOTHING_FACTOR = 0.1; // How quickly the wave reacts (0.1 = slow/smooth, 1 = instant)
        
        function draw() {
            animationId = requestAnimationFrame(draw);
            
            // Handle Entry/Exit Animation
            // Smoothly interpolate visualScale towards target
            visualScale += (targetVisualScale - visualScale) * 0.1;
            
            // If we are stopping and scale is near 0, stop everything
            if (!isListening && visualScale < 0.01) {
                visualScale = 0;
                cancelAnimationFrame(animationId);
                animationId = null;
                
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                }
                
                // Clear and reset
                const width = canvas.parentElement.clientWidth;
                const height = canvas.parentElement.clientHeight;
                ctx.clearRect(0, 0, width, height);
                siriContainer.style.transform = 'scale(1)';
                siriContainer.style.opacity = ''; // Revert to CSS default (0.4)
                return;
            }
            
            // Get Audio Data if available
            if (isListening && analyser) {
                analyser.getByteTimeDomainData(dataArray);
                
                // Calculate volume
                let sum = 0;
                for(let i = 0; i < dataArray.length; i++) {
                    const amplitude = (dataArray[i] - 128) / 128;
                    sum += amplitude * amplitude;
                }
                const rms = Math.sqrt(sum / dataArray.length);
                let targetVolume = Math.min(rms * 5, 1); 
                
                // Noise Gate
                if (targetVolume < NOISE_THRESHOLD) {
                    targetVolume = 0;
                } else {
                    targetVolume = (targetVolume - NOISE_THRESHOLD) / (1 - NOISE_THRESHOLD);
                }
                
                // Smooth volume
                currentVolume += (targetVolume - currentVolume) * SMOOTHING_FACTOR;
            } else {
                currentVolume += (0 - currentVolume) * 0.1; // Fade volume to 0
            }
            
            // Apply Visual Scale to everything
            const volume = currentVolume * visualScale; // Combined effect
            
            // Clear canvas
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            ctx.clearRect(0, 0, width, height);
            
            // Pulse the siri blobs
            // We also use visualScale to fade them in/out
            const scale = 1 + volume * 0.2;
            siriContainer.style.transform = `scale(${scale})`;
            // Base opacity is 0.4. We add volume effect. visualScale controls the VOLUME effect only?
            // No, visualScale controls the transition from Idle to Active.
            // If visualScale is 0 (Idle), opacity should be 0.4.
            // If visualScale is 1 (Active), opacity should be 0.4 + volume * 0.3.
            // So: 0.4 + (volume * 0.3 * visualScale) is not quite right because volume is already scaled by visualScale?
            // Let's simplify:
            // When listening stops, visualScale -> 0.
            // We want opacity to go to 0.4.
            // Current formula: (0.4 + volume * 0.3) * visualScale -> goes to 0.
            
            // Correct formula:
            // Blend between 0.4 and (0.4 + volume * 0.3)
            // Actually, just keep base opacity 0.4 and add the dynamic part scaled by visualScale
            // But wait, 'volume' already includes visualScale decay in my code above (volume = currentVolume * visualScale)
            // So simply:
            siriContainer.style.opacity = 0.4 + (volume * 0.3);

            // Draw smooth waves
            // We draw multiple overlapping waves to simulate the "twisted" ribbon look
            
            // Base idle movement
            const idleSpeed = 0.02;
            const activeSpeed = 0.1;
            phase += idleSpeed + (volume * activeSpeed); 
            
            // Base amplitude (how tall the waves are)
            // We multiply by visualScale so they grow from 0 on start
            const idleAmp = 10; 
            const activeAmp = 50;
            const baseAmp = (idleAmp + (volume * activeAmp)) * visualScale; 
            
            if (visualScale > 0.01) {
                // Draw background "Ghost" waves for depth
                drawSineWave(ctx, width, height, phase, baseAmp * 0.8, 1, `rgba(224, 195, 252, ${0.15 * visualScale})`); // Soft Purple
                drawSineWave(ctx, width, height, phase + 2, baseAmp * 0.9, 1.2, `rgba(142, 197, 252, ${0.15 * visualScale})`); // Soft Blue
                
                // Draw the "Main" thick twisted ribbon
                drawTwistedRibbon(ctx, width, height, phase, baseAmp, volume, visualScale);
                
                // Draw Reflection (Mirrored at bottom)
                ctx.save();
                ctx.globalAlpha = 0.2 * visualScale; // Fade reflection too
                ctx.translate(0, height * 1.45); 
                ctx.scale(1, -0.6); 
                ctx.filter = 'blur(3px)'; 
                
                drawTwistedRibbon(ctx, width, height, phase, baseAmp, volume, visualScale);
                
                ctx.restore();
            }
        }

        function drawSineWave(ctx, width, height, phase, amplitude, frequency, color) {
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            
            for (let x = 0; x <= width; x++) {
                const y = Math.sin(x * 0.01 * frequency + phase) * amplitude + (height / 2);
                ctx.lineTo(x, y);
            }
            
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fillStyle = color;
            ctx.fill();
        }
        
        function drawTwistedRibbon(ctx, width, height, phase, amplitude, volume, visualScale) {
            // Create the gradient for the ribbon
            const gradient = ctx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0.1, `rgba(224, 195, 252, ${0.9 * visualScale})`); 
            gradient.addColorStop(0.5, `rgba(142, 197, 252, ${0.9 * visualScale})`); 
            gradient.addColorStop(0.9, `rgba(144, 247, 236, ${0.9 * visualScale})`); 
            
            ctx.lineWidth = 0; 
            
            ctx.beginPath();
            
            // Top edge
            for (let x = 0; x <= width; x++) {
                const y1 = Math.sin(x * 0.012 + phase) * amplitude;
                const twist = Math.cos(x * 0.02 + phase * 1.5) * (10 + volume * 15) * visualScale; // Scale twist too
                const y = (height / 2) + y1 - twist;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            // Bottom edge
            for (let x = width; x >= 0; x--) {
                const y1 = Math.sin(x * 0.012 + phase) * amplitude;
                const twist = Math.cos(x * 0.02 + phase * 1.5) * (10 + volume * 15) * visualScale;
                const thickness = (15 + (volume * 10)) * visualScale; // Scale thickness
                const y = (height / 2) + y1 + twist + thickness;
                ctx.lineTo(x, y);
            }
            
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Highlight stroke
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.6 * visualScale})`;
            ctx.lineWidth = 2;
            for (let x = 0; x <= width; x++) {
                const y1 = Math.sin(x * 0.012 + phase) * amplitude;
                const twist = Math.cos(x * 0.02 + phase * 1.5) * (10 + volume * 15) * visualScale;
                const y = (height / 2) + y1 - twist;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Glow
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = `rgba(142, 197, 252, ${0.6 * visualScale})`;
            ctx.globalCompositeOperation = "screen";
            ctx.fill(); 
            ctx.restore();
        }
    </script>
</body>
</html>
